spring:
  application:
    name: seat-reservation
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

app:
  admin-token: ${ADMIN_TOKEN:change-me}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
